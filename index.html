<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kod Yapbozu</title>
<style>
:root{--bg:#f6f5f1;--fg:#1d2330;--mut:#646b78;--panel:#fff;--panel2:#f2f1ed;--line:#e3e1d9;--acc:#4353d6;--acch:#3645bd;--soft:#e9ecfd;
 --outbg:#fafaf7;--err:#c53030;--errsoft:#fdecea;--ok:#1f8a5b;--oksoft:#e2f4ea;--okline:#8fd3b4;--golge:rgba(30,35,60,.06);
 --hk:#008000;--hb:#008000;--hm:#ba2121;--hn:#0a7d54;--mono:Consolas,"SF Mono",Menlo,"DejaVu Sans Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;line-height:1.5;font-size:17px;padding-bottom:60px}
header{background:var(--bg);border-bottom:2px solid var(--line);padding:12px 16px}
.ust{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
h1{font-size:26px;color:var(--acc);font-family:var(--mono);margin-right:auto}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{font:inherit;font-size:15px;font-weight:700;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
nav button.sec{border-color:var(--acc);color:var(--acc);background:var(--soft)}
nav button .tk{color:var(--ok);margin-left:6px}
main{max-width:1180px;margin:0 auto;padding:22px 16px;display:flex;flex-direction:column;gap:18px}
.gorev h2{font-size:22px;letter-spacing:-.01em;margin-bottom:6px}
.gorev p{max-width:75ch;margin-bottom:6px}
.iki{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:stretch}
.lbl{font-size:14px;color:var(--mut);font-weight:700;margin-bottom:6px;min-height:22px}
.sutun{display:flex;flex-direction:column}
.alan{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:320px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 8px var(--golge)}
.alan.hedef{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.bosluk{margin:auto;color:var(--mut);font-size:16px;text-align:center;pointer-events:none}
.sira{display:flex;align-items:center;gap:8px}
.no{flex:none;width:22px;text-align:right;color:var(--mut);font-family:var(--mono);font-size:14px;user-select:none}
.satir{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:7px 12px 7px 8px;
 cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--mono);font-size:17px;line-height:1.4}
.satir:hover{border-color:var(--acc)}
.satir:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.satir .tut{flex:none;color:#a9adb6;font-size:14px;letter-spacing:-2px}
.satir .metin{white-space:pre-wrap;overflow-wrap:anywhere}
.satir.hatali{border-color:var(--err);background:var(--errsoft)}
.satir.kendi{border-style:dashed;border-color:var(--acc);background:#fff;flex:1 1 auto}
.satir.kendi input{font:inherit;color:inherit;border:0;outline:0;background:none;width:100%;min-width:120px;user-select:text;-webkit-user-select:text}
.satir.kendi:focus-within{box-shadow:0 0 0 3px var(--soft)}
.oklar{flex:none;margin-left:auto;display:flex;gap:4px}
.oklar button{font:inherit;font-size:15px;line-height:1;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer}
.oklar button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.oklar button:disabled{opacity:.35;cursor:default}
.girinti{flex:none;align-self:stretch;background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px var(--birim))}
.yer{height:40px;border:2px dashed var(--acc);background:var(--soft);border-radius:10px;flex:1}
.hayalet{position:fixed;z-index:40;pointer-events:none;box-shadow:0 8px 24px rgba(30,35,60,.2);border-color:var(--acc);cursor:grabbing;opacity:.95}
.soluk{opacity:.25}
.kayip{display:none}
button.b{font:inherit;font-size:16px;font-weight:700;padding:9px 16px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer}
button.b:hover{border-color:var(--acc)}
button.b.ana{background:var(--acc);color:#fff;border-color:var(--acc)}
button.b.ana:hover{background:var(--acch)}
button.b.ekle{align-self:flex-start;margin-left:30px;font-size:15px;padding:6px 12px;border-style:dashed;background:none;color:var(--acc)}
button.duz{font:inherit;font-size:15px;border:0;background:none;color:var(--mut);text-decoration:underline;cursor:pointer;margin-left:auto}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.kutu{background:var(--outbg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.cikti{font-family:var(--mono);font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:96px}
.cikti input{font:inherit;background:#fff;color:var(--acc);border:2px solid var(--acc);border-radius:6px;padding:1px 8px;width:140px;outline:none}
.cikti .gir{color:var(--acc);font-weight:700}
.cikti .sis{color:var(--mut);font-family:"Segoe UI",system-ui,sans-serif;font-size:15px}
.hata{border-color:var(--err);background:var(--errsoft)}
.hata small{display:block;color:var(--mut);font-family:var(--mono);font-size:14px;margin-top:4px}
.sonuc b.d{color:var(--ok)}.sonuc b.y{color:var(--err)}
.kaydir{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:14px;color:var(--mut);padding:4px 14px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 14px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.k{font-family:var(--mono);font-size:16px;white-space:pre-wrap}
.bitti{border:2px solid var(--okline);background:var(--oksoft);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.bitti strong{font-size:18px}
pre.kod{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:17px;line-height:1.45;overflow-x:auto}
.hk{color:var(--hk);font-weight:700}.hb{color:var(--hb)}.hm{color:var(--hm)}.hn{color:var(--hn)}
@media(max-width:1100px){.satir{font-size:15.5px}}
@media(max-width:860px){.iki{grid-template-columns:minmax(0,1fr)}.alan{min-height:150px}}
</style>
</head>
<body>
<header><div class="ust"><h1>Kod Yapbozu</h1><nav id="nav"></nav></div></header>
<main id="ana"></main>
<script>
/*MOTOR-BAS*/
/* Derste işlenen Python yapılarını çalıştıran küçük yorumlayıcı:
   atama, int, input, print, karşılaştırma, aritmetik, if / elif / else. */
var Motor=(function(){
'use strict';
function Hata(tur,satir,mesaj){this.tur=tur;this.satir=satir;this.mesaj=mesaj;}
function Ond(v){this.v=v;}
var ANAHTAR=['if','elif','else','and','or','not','True','False','None','pass','for','while','def','return','in','is','import','from','class','break','continue','lambda','try','except','finally','with','as','global','nonlocal','del','raise','assert','yield','async','await'];
var M={
 ikinokta:'Bu satırın sonunda ne eksik?',
 esit:'Burada bir değer mi atıyoruz, yoksa soru mu soruyoruz? Tek eşittir mi, iki eşittir mi?',
 ayni:'Bu satırı Python anlayamadı. Yazımını kontrol et: parantezler, tırnaklar, işaretler.',
 disi:'Burada yalnız bu derste işlenen yapılar çalışıyor.'
};
function parcala(s,no){
 var p=[],i=0,n=s.length,m;
 while(i<n){
  var c=s[i];
  if(c===' '||c==='\t'){i++;continue;}
  if(c==='#')break;
  if('“”„‟‘’'.indexOf(c)>=0)throw new Hata('SyntaxError',no,'Bu tırnak işaretini Python tanımıyor. Klavyedeki düz tırnağı (") kullan.');
  var f=(c==='f'||c==='F')&&(s[i+1]==='"'||s[i+1]==="'");
  if(c==='"'||c==="'"||f){
   if(f)i++;
   var t=s[i],j=i+1,d='';
   while(j<n&&s[j]!==t){
    if(s[j]==='\\'&&j+1<n){var k=s[j+1];d+=k==='n'?'\n':k==='t'?'\t':(k===t||k==='\\'||k==='"'||k==="'")?k:'\\'+k;j+=2;}
    else d+=s[j++];
   }
   if(j>=n)throw new Hata('SyntaxError',no,'Bu satırda açılan tırnak kapanmamış.');
   p.push({t:f?'fmetin':'metin',v:d});i=j+1;continue;
  }
  if(m=/^(\d+\.\d*|\.\d+|\d+)/.exec(s.slice(i))){
   var sonra=s[i+m[0].length]||'';
   if(/[A-Za-z_ÇĞİÖŞÜçğıöşü]/.test(sonra))throw new Hata('SyntaxError',no,M.ayni);
   if(/^0\d/.test(m[0])&&/[1-9]/.test(m[0])&&m[0].indexOf('.')<0)throw new Hata('SyntaxError',no,M.ayni);
   p.push({t:'sayi',v:m[0].indexOf('.')>=0?new Ond(parseFloat(m[0])):parseInt(m[0],10)});i+=m[0].length;continue;
  }
  if(m=/^[A-Za-z_ÇĞİÖŞÜçğıöşü][A-Za-z0-9_ÇĞİÖŞÜçğıöşü]*/.exec(s.slice(i))){
   p.push({t:ANAHTAR.indexOf(m[0])>=0?'kw':'ad',v:m[0]});i+=m[0].length;continue;
  }
  if(m=/^(==|!=|<=|>=|\+=|-=|\*=|\/\/|\*\*|[-+*\/%<>=():,])/.exec(s.slice(i))){p.push({t:'op',v:m[0]});i+=m[0].length;continue;}
  throw new Hata('SyntaxError',no,M.ayni);
 }
 p.push({t:'son',v:''});
 return p;
}
function Ayr(p,no){this.p=p;this.i=0;this.no=no;}
Ayr.prototype={
 bak:function(v){var x=this.p[this.i];return (x.t==='op'||x.t==='kw')&&x.v===v;},
 al:function(v){if(this.bak(v)){this.i++;return true;}return false;},
 hata:function(m){throw new Hata('SyntaxError',this.no,m||M.ayni);},
 veya:function(){var a=this.ve();while(this.al('or'))a={k:'or',a:a,b:this.ve()};return a;},
 ve:function(){var a=this.degil();while(this.al('and'))a={k:'and',a:a,b:this.degil()};return a;},
 degil:function(){if(this.al('not'))return {k:'not',a:this.degil()};return this.kars();},
 kars:function(){
  var ilk=this.top(),zincir=[],o;
  while((o=this.p[this.i]).t==='op'&&['==','!=','<','>','<=','>='].indexOf(o.v)>=0){this.i++;zincir.push([o.v,this.top()]);}
  return zincir.length?{k:'kars',a:ilk,z:zincir}:ilk;
 },
 top:function(){var a=this.carp(),o;while((o=this.p[this.i]).t==='op'&&(o.v==='+'||o.v==='-')){this.i++;a={k:'ar',o:o.v,a:a,b:this.carp()};}return a;},
 carp:function(){var a=this.birli(),o;while((o=this.p[this.i]).t==='op'&&['*','/','//','%'].indexOf(o.v)>=0){this.i++;a={k:'ar',o:o.v,a:a,b:this.birli()};}return a;},
 birli:function(){if(this.al('-'))return {k:'eksi',a:this.birli()};if(this.al('+'))return this.birli();return this.us();},
 us:function(){var a=this.cagri();if(this.al('**'))return {k:'ar',o:'**',a:a,b:this.birli()};return a;},
 cagri:function(){
  var a=this.atom();
  while(this.bak('(')){
   this.i++;var ar=[];
   if(!this.al(')')){
    for(;;){
     if(this.bak(')')&&ar.length){this.i++;break;}
     ar.push(this.veya());
     if(this.bak('='))this.hata(M.esit);
     if(this.al(','))continue;
     if(this.al(')'))break;
     this.hata(this.p[this.i].t==='son'?'Bu satırda açılan parantez kapanmamış.':null);
    }
   }
   a={k:'cagri',f:a,ar:ar,no:this.no};
  }
  return a;
 },
 atom:function(){
  var x=this.p[this.i];
  if(x.t==='sayi'||x.t==='metin'||x.t==='fmetin'){
   this.i++;
   if(x.t==='sayi')return {k:'sabit',v:x.v};
   var n=this.metin(x);
   while(this.p[this.i].t==='metin'||this.p[this.i].t==='fmetin')n={k:'ar',o:'+',a:n,b:this.metin(this.p[this.i++])};
   return n;
  }
  if(x.t==='ad'){this.i++;return {k:'ad',v:x.v,no:this.no};}
  if(x.t==='kw'&&(x.v==='True'||x.v==='False'||x.v==='None')){this.i++;return {k:'sabit',v:x.v==='None'?null:x.v==='True'};}
  if(this.al('(')){
   var a=this.veya();
   if(this.bak('='))this.hata(M.esit);
   if(!this.al(')'))this.hata(this.p[this.i].t==='son'?'Bu satırda açılan parantez kapanmamış.':null);
   return a;
  }
  if(x.t==='op'&&x.v==='='&&this.i>0)this.hata(M.esit);
  this.hata();
 },
 metin:function(x){
  if(x.t==='metin')return {k:'sabit',v:x.v};
  var par=[],re=/\{\{|\}\}|\{([^{}]*)\}|[{}]/g,son=0,m,d='';
  while(m=re.exec(x.v)){
   d+=x.v.slice(son,m.index);son=re.lastIndex;
   if(m[0]==='{{')d+='{';else if(m[0]==='}}')d+='}';
   else if(m[1]===undefined||!m[1].trim())this.hata();
   else{par.push({k:'sabit',v:d});d='';var alt=new Ayr(parcala(m[1],this.no),this.no),e=alt.veya();if(alt.p[alt.i].t!=='son')this.hata();par.push(e);}
  }
  par.push({k:'sabit',v:d+x.v.slice(son)});
  return {k:'fmetin',p:par};
 },
 bitti:function(){return this.p[this.i].t==='son';}
};
/* satirlar: [{g: girinti boşluğu, s: metin}] ; boş satırlar atlanır */
function coz(satirlar){
 var L=[];
 satirlar.forEach(function(x,i){var s=x.s.trim();if(s&&s[0]!=='#')L.push({g:x.g,s:s,no:i+1});});
 /* hatalar yukarıdan aşağıya, satıra gelindiğinde söylenir (Python gibi) */
 function ac(x){if(x.girHata)throw x.girHata;if(!x.p)x.p=parcala(x.s,x.no);return x;}
 /* girinti düzeyleri, Python'un yığın kuralıyla */
 var yigin=[0];
 L.forEach(function(x){
  if(x.g>yigin[yigin.length-1])yigin.push(x.g);
  else{while(yigin[yigin.length-1]>x.g)yigin.pop();
   if(yigin[yigin.length-1]!==x.g){yigin.push(x.g);x.girHata=new Hata('IndentationError',x.no,'Bu satırın girintisi üstündeki hiçbir satırla aynı hizada değil.');}}
 });
 var i=0;
 function blok(g){
  var cikan=[];
  while(i<L.length){
   if(L[i].girHata)throw L[i].girHata;
   if(L[i].g<g)break;
   if(L[i].g>g)throw new Hata('IndentationError',L[i].no,'Bu satır içeriden başlıyor ama hemen üstündeki satır bir koşul değil. Girintisine bak.');
   cikan.push(deyim(g));
  }
  return cikan;
 }
 function govde(a,x,ad,g){
  /* koşul okundu; iki nokta ve gövde */
  if(!a.al(':')){
   if(a.bak('='))a.hata(M.esit);
   a.hata(a.bitti()?M.ikinokta:null);
  }
  if(!a.bitti()){var ic=basit(a,x);i++;return [ic];}
  i++;
  if(i<L.length&&L[i].girHata)throw L[i].girHata;
  if(i>=L.length||L[i].g<=g)throw new Hata('IndentationError',i<L.length?L[i].no:x.no,
   '"'+ad+'" satırının altında ona bağlı bir satır olmalı. Hangi satır ona ait? Girintisine bak.');
  return blok(L[i].g);
 }
 function basit(a,x){
  var p=a.p;
  if(a.bak('pass')){a.i++;if(!a.bitti())a.hata();return {k:'pass'};}
  if(p[a.i].t==='kw'&&['if','elif','else'].indexOf(p[a.i].v)>=0)a.hata();
  if(p[a.i].t==='kw'&&['True','False','None','not'].indexOf(p[a.i].v)<0)a.hata(M.disi);
  if(p[a.i].t==='ad'&&p[a.i+1].t==='op'&&['=','+=','-=','*='].indexOf(p[a.i+1].v)>=0){
   var ad=p[a.i].v,o=p[a.i+1].v;a.i+=2;
   var e=a.veya();
   if(!a.bitti())a.hata(a.bak('=')?M.esit:null);
   return {k:'ata',ad:ad,e:o==='='?e:{k:'ar',o:o[0],a:{k:'ad',v:ad,no:x.no},b:e},no:x.no};
  }
  var d=a.veya();
  if(!a.bitti())a.hata(a.bak('=')?M.esit:null);
  return {k:'ifade',e:d,no:x.no};
 }
 function deyim(g){
  var x=ac(L[i]),a=new Ayr(x.p,x.no);
  if(a.bak('elif')||a.bak('else'))throw new Hata('SyntaxError',x.no,'Bu "'+x.p[0].v+'" hangi "if" satırına ait? Yerine ve girintisine bak.');
  if(a.al('if')){
   if(a.bitti()||a.bak(':'))a.hata('"if" satırında koşul eksik.');
   var kos=a.veya(),dal=[{c:kos,no:x.no,g:govde(a,x,'if',g)}],son=null;
   while(i<L.length&&(L[i].girHata||L[i].g===g)){
    var y=ac(L[i]),b=new Ayr(y.p,y.no);
    if(b.al('elif')){if(b.bitti()||b.bak(':'))b.hata('"elif" satırında koşul eksik.');var k2=b.veya();dal.push({c:k2,no:y.no,g:govde(b,y,'elif',g)});}
    else if(b.al('else')){
     if(!b.bitti()&&!b.bak(':'))b.hata('"else" satırında ":" bekleniyordu. "else" koşul alır mı?');
     son=govde(b,y,'else',g);break;
    }else break;
   }
   return {k:'if',dal:dal,son:son};
  }
  var d=basit(a,x);i++;return d;
 }
 if(L.length&&L[0].g>0)throw new Hata('IndentationError',L[0].no,'Programın ilk satırı içeriden başlıyor. Girintisine bak.');
 return blok(0);
}
function say(v){return typeof v==='number'||typeof v==='boolean'||v instanceof Ond;}
function ham(v){return v instanceof Ond?v.v:Number(v);}
function tipAd(v){return v===null?'NoneType':typeof v==='boolean'?'bool':typeof v==='number'?'int':v instanceof Ond?'float':typeof v==='string'?'str':'builtin_function_or_method';}
function yazi(v){
 if(v===null)return 'None';if(v===true)return 'True';if(v===false)return 'False';
 if(v instanceof Ond){var s=String(v.v);return /^-?\d+$/.test(s)?s+'.0':s;}
 if(v&&v.yerlesik)return '<built-in function '+v.yerlesik+'>';
 return String(v);
}
function dogru(v){if(v===null)return false;if(say(v))return ham(v)!==0;if(typeof v==='string')return v!=='';return true;}
function tipHata(no){return new Hata('TypeError',no,'Bu satırda bir sayıyla bir metin birlikte kullanılıyor. Değişkenin türünü kontrol et.');}
var YER={print:1,input:1,int:1,float:1,str:1,bool:1};
/* üreteç: input gelince {soru} verir, next(cevap) ile sürer; yaz(metin) çıktı alır */
function* yurut(agac,yaz){
 var D=Object.create(null),no=1;
 function* ev(e){
  var a,b,i;
  switch(e.k){
  case 'sabit':return e.v;
  case 'ad':
   if(e.v in D)return D[e.v];
   if(YER[e.v])return {yerlesik:e.v};
   var h=new Hata('NameError',e.no,'"'+e.v+'" bu satırda kullanılıyor ama daha önce tanımlanmamış. Önce hangi satır çalışmalı?');h.ad=e.v;throw h;
  case 'and':a=yield* ev(e.a);return dogru(a)?yield* ev(e.b):a;
  case 'or':a=yield* ev(e.a);return dogru(a)?a:yield* ev(e.b);
  case 'not':return !dogru(yield* ev(e.a));
  case 'eksi':a=yield* ev(e.a);if(!say(a))throw tipHata(no);return a instanceof Ond?new Ond(-a.v):-Number(a);
  case 'fmetin':var t='';for(i=0;i<e.p.length;i++)t+=yazi(yield* ev(e.p[i]));return t;
  case 'kars':
   a=yield* ev(e.a);
   for(i=0;i<e.z.length;i++){b=yield* ev(e.z[i][1]);if(!kars(e.z[i][0],a,b))return false;a=b;}
   return true;

/* ---------------------------------------------------------------- kontrol */
function kontrol(){
 calisma++;ciktiEl.hidden=true;ciktiEl.innerHTML='';sonucEl.innerHTML='';hataIsareti();if(bosMu())return;
 var prog=programSatirlari();
 try{Motor.coz(prog);}catch(e){if(!(e instanceof Motor.Hata))throw e;sonucEl.appendChild(hataKutusu(e));return;}
 var hepsi=true,ilkHata=null,govde='';
 P().testler.forEach(function(t){
  var r=Motor.dene(prog,[t[0]]),iyi=!r.hata&&r.soruSay===1&&sade(r.cikti)===sade(t[1]);
  if(!iyi)hepsi=false;if(r.hata&&!ilkHata)ilkHata=r.hata;
  var c=r.cikti.replace(/\n$/,'');
  govde+='<tr><td>'+esc(t[0])+'</td><td class="k">'+esc(t[1])+'</td><td class="k">'+(c?esc(c):'<span style="color:var(--mut)">'+(r.hata?'hata':'hiçbir şey yazmadı')+'</span>')+'</td><td><b class="'+(iyi?'d">✓ doğru':'y">✗ farklı')+'</b></td></tr>';
 });
 if(ilkHata)sonucEl.appendChild(hataKutusu(ilkHata));
 else{
  var k=el('div','kutu sonuc kaydir');
  k.innerHTML='<table><thead><tr><th>'+esc(P().girdiAd)+'</th><th>Yazması gereken</th><th>Senin programın</th><th></th></tr></thead><tbody>'+govde+'</tbody></table>';
  sonucEl.appendChild(k);
 }
 if(hepsi){D().tamam=kodMetni();kaydet();navCiz();bittiCiz();bittiEl.scrollIntoView({block:'end'});}
 else sonucEl.scrollIntoView({block:'nearest'});
}
function bittiCiz(){
 bittiEl.innerHTML='';var kod=D().tamam;if(!kod)return;
 var b=el('div','bitti'),n=durum.sekme+1;
 var ayni=kod===kodMetni();
 b.appendChild(el('strong','',P().kopya?(ayni?'Oyunun çalışıyor. Çalıştır\'a basıp istediğin kadar oynayabilirsin.':'Daha önce çalışan oyunun:'):(ayni?'Programın çalışıyor.':'Bu problemi daha önce çözdün.')));
 if(P().kopya){
  if(!/^\s*else\s*:/m.test(kod))b.appendChild(el('div','','Son dalı koşul yazmadan da kurabilir misin?'));
  var p=el('pre','kod',hl(kod));b.appendChild(p);
  var s=el('div','btns'),d=dugme('b ana','Kodu kopyala',function(){kopyala(kod,p,function(iyi){d.textContent=iyi?'Kopyalandı':'Kod seçildi, Ctrl+C ile kopyala';setTimeout(function(){d.textContent='Kodu kopyala';},2500);});});
  s.appendChild(d);b.appendChild(s);
 }
 if(n<PROBLEMLER.length){var t=el('div','btns');t.appendChild(dugme('b ana','Sonraki problem: '+PROBLEMLER[n].ad,function(){durum.sekme=n;kaydet();sayfa();window.scrollTo(0,0);}));b.appendChild(t);}
 bittiEl.appendChild(b);
}
function kopyala(t,p,bitti){
 function yedek(){var a=el('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();var o=false;try{o=document.execCommand('copy');}catch(e){}a.remove();
  if(!o){var r=document.createRange();r.selectNodeContents(p);var s=getSelection();s.removeAllRanges();s.addRange(r);}bitti(o);}
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(function(){bitti(true);},yedek);else yedek();
}
birimOlc();sayfa();
})();
</script>
</body>
</html>
